[project]
name = "sondr-convert-clap"
version = "0.1.0"
description = "Converts HF CLAP (laion/clap-htsat-fused) to Core ML for Sondr"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools>=8",
    "numpy>=2,<2.4",
    "torch==2.7.0",
    "transformers>=4.45,<5",
    "librosa>=0.10,<1",
]

[tool.uv]
package = false
